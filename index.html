<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>landing page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main">
        <div class="head"><h2>FROM</h2></div>
        <div class="form">
            <div class="onee">
           <label for="name">Full Name :</label>
           <input type="text" id="username" placeholder="enter your name">
        </div>
        <div class="onee">
           <label for="phone number">Contact Number :</label>
           <input type="text" id="ph_number" placeholder="enter your number">
        </div>
        <div class="onee two">
           <label for="Address">Address :</label>
           <textarea id="ph_number" placeholder="enter your number"></textarea>
        </div>
        <div class="onee ">
           <label for="Email Address">Email Address :</label>
           <input type="text" id="email" placeholder="enter your email">
        </div>
        <div class="onee">
           <label for="department">Department :</label>
           <select name="department" id="department">
            <option value="HR">HR</option>
            <option value="Sales">Sales</option>
            <option value="Development">Development</option>
            <option value="Marketing">Marketing</option>
            <option value="Others">Others</option>
           </select>
        </div>
        <div class="onee">
           <div class="genders">
           <label for="gender">Gender :</label>
           <input type="radio" id="male" value="male" name="gender">
           <label for="male">Male</label>
           <input type="radio" id="male" value="male" name="gender">
           <label for="Female">Female</label>
           <input type="radio" id="others" value="others" name="gender">
           <label for="others">Prefer not to say</label>
        </div>
        </div>
        </div>


       <div class="btn"><button>Submit</button></div>
    </div>
