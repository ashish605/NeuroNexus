<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>landing page</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="main">
    <div class="head">
      <h2>FROM</h2>
    </div>
    <div class="form">
      <div class="onee">
        <label for="name">Full Name :</label>
        <input type="text" id="username" placeholder="enter your name">
      </div>
      <div class="onee">
        <label for="phone number">Contact Number :</label>
        <input type="text" id="ph_number" placeholder="enter your number">
      </div>
      <div class="onee two">
        <label for="Address">Address :</label>
        <textarea id="Address" placeholder="enter your number"></textarea>
      </div>
      <div class="onee ">
        <label for="Email Address">Email Address :</label>
        <input type="text" id="email" placeholder="enter your email">
      </div>
      <div class="onee">
        <label for="department">Department :</label>
        <select name="department" id="department">
          <option value="HR">HR</option>
          <option value="Sales">Sales</option>
          <option value="Development">Development</option>
          <option value="Marketing">Marketing</option>
          <option value="Others">Others</option>
        </select>
      </div>
      <div class="onee">
        <div class="genders">
          <label for="gender">Gender :</label>
          <input type="radio" id="male" value="male" name="gender" id="male">
          <label for="male">Male</label>
          <input type="radio" id="male" value="Female" name="gender" id="Female">
          <label for="Female">Female</label>
          <input type="radio" id="others" value="others" name="gender" id="others">
          <label for="others">Prefer not to say</label>
        </div>
      </div>
    </div>


    <div class="btn"><button>Submit</button></div>
  </div>

  <script>
    document.querySelector(".btn").addEventListener('click', () => {
      const data = {
        Full_Name: document.getElementById("username").value,
        contact_no: document.getElementById("ph_number").value,
        address: document.getElementById("Address").value,
        email_add: document.getElementById("email").value,
        department: document.getElementById("department").value,
        gender: document.querySelector('input[name="gender"]:checked').value
      };

      fetch('http://127.0.0.1:5000/add', {
          method: 'POST',
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data) //sending data to backend in the post request body so data remain safe
        }).then(res => {
          if (!res.ok) throw new Error("Server error");
          return res.text(); // Use .text() if server sends plain text
        })
        .then(result => {
          console.log(result);
          alert("✅ Data saved successfully!");
        })
        .catch(err => {
          console.error("❌ Error:", err);
          alert("❌ Failed to save data.");
        });

    });
  </script>

</body>

</html>
